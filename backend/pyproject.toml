[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nokware-backend"
version = "0.1.0"
description = "Nokware backend — FastAPI + Appwrite + pgvector RAG + MinIO + Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "pydantic-settings",
    "appwrite>=23,<24",
    "psycopg[binary]",
    "pgvector>=0.2.5,<0.4",
    "minio>=7,<8",
    "langchain>=1,<2",
    "langchain-google-genai>=4,<5",
    "langchain-postgres>=0.0.17,<0.1",
]

[tool.setuptools.packages.find]
include = ["app*"]
