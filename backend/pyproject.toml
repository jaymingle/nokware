[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nokware-backend"
version = "0.1.0"
description = "Nokware backend — FastAPI + Appwrite + pgvector RAG + MinIO + Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "pydantic-settings",
    "appwrite>=17,<18",
    "psycopg[binary]",
    "pgvector>=0.2.5,<0.4",
    "minio>=7,<8",
    "langchain>=1,<2",
    "langchain-google-genai>=4,<5",
    "langchain-postgres>=0.0.17,<0.1",
    "langchain-text-splitters>=1,<2",
    "pypdf>=6,<7",
    "pdfplumber>=0.11,<0.12",  # budget tables: pypdf flattens a table, pdfplumber keeps the lines (budget_extract.py)
    "python-multipart>=0.0.32,<0.1",
    "pillow>=12,<13",
    "httpx>=0.28,<1",
    "redis>=5,<8",
    "twilio>=9,<10",
    "google-genai>=2,<3",
    "av>=16,<17",
    "openpyxl>=3.1,<4",
    "reportlab>=4,<5",
    "python-docx>=1,<2",
    "cryptography>=45,<51",  # seals the proof of a confirmed phone (phone_proof.py)
    "mcp>=2.2,<3",  # the report-figures server at /mcp (stats_mcp.py)
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "fakeredis>=2,<3", "fonttools>=4,<5", "ruff>=0.13,<0.14"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.json", "fonts/*.ttf", "fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "I", "B", "UP", "SIM", "PIE", "RUF100"]
# zip() of lists that are equal by construction; a nested ternary reads worse than the if block.
ignore = ["B905", "SIM108"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "app.dependencies.require_roles"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
