[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nokware-backend"
version = "0.1.0"
description = "Nokware backend — FastAPI + Appwrite + pgvector RAG + MinIO + Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "pydantic-settings",
    "appwrite>=17,<18",
    "psycopg[binary]",
    "pgvector>=0.2.5,<0.4",
    "minio>=7,<8",
    "langchain>=1,<2",
    "langchain-google-genai>=4,<5",
    "langchain-postgres>=0.0.17,<0.1",
    "langchain-text-splitters>=1,<2",
    "pypdf>=6,<7",
    "python-multipart>=0.0.32,<0.1",
    "pillow>=12,<13",
    "httpx>=0.28,<1",
    "redis>=5,<8",
    "twilio>=9,<10",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "fakeredis>=2,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
