# Nokware seed accounts for scripts/seed_users.py.
#
# Copy this file to scripts/seed_users.toml (git-ignored) and replace every
# email and CHANGE_ME password with real values. Passwords need at least 8
# characters; the CHANGE_ME placeholder is rejected.
#
# Required shape: one account per department team (12, including dept-press),
# one liaison account per agency (Police and GNFS, which receive citizen safety
# reports), one contributor, and two mce-team accounts (the MCE plus a separate
# admin account with the same permissions) — 17 in total.

[[users]]
name = "Central Administration"
email = "central-administration@example.org"
password = "CHANGE_ME"
team = "dept-central-administration"

