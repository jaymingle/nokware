# Nokware seed accounts for scripts/seed_users.py.
#
# Copy this file to scripts/seed_users.toml (git-ignored) and replace every
# email and CHANGE_ME password with real values. Passwords need at least 8
# characters; the CHANGE_ME placeholder is rejected.
#
# Required shape: one account per department team (AMA's 18 departments plus
# dept-press, so 19), one liaison account per agency (Police and GNFS, which
# receive citizen safety reports), one contributor, and two mce-team accounts
# (the MCE plus a separate admin account with the same permissions): 24 in total.
#
# Moving from the 12-department list: scripts/migrate_departments.py moves the
# Health, Transport and Agriculture accounts to their new teams. In your own
# seed_users.toml, change only those three `team =` lines (to
# dept-metro-public-health, dept-metro-transport and dept-food-agriculture),
# keep their emails, and add the seven new departments.

